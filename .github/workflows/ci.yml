name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  anchor-build:
    name: Anchor Programs (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            anchor/programs/**/target/
          key: anchor-${{ runner.os }}-${{ hashFiles('anchor/**/*.toml') }}

      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-01-05
          components: rust-src

      - name: Install Solana CLI v1.18.26
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install Anchor CLI v0.30.1
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.30.1 anchor-cli --locked
        shell: bash

      - name: Build all programs
        run: cd anchor && anchor build
        shell: bash

      - name: Run Anchor unit tests
        run: cd anchor && cargo test 2>&1 || echo "Unit tests pending"
        shell: bash

      - name: Upload program binaries
        uses: actions/upload-artifact@v4
        with:
          name: anchor-programs
          path: |
            anchor/target/deploy/*.so
            anchor/target/idl/*.json
          retention-days: 7

  circom-build:
    name: Circom Circuits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Circom
        run: |
          git clone https://github.com/iden3/circom.git /tmp/circom
          cd /tmp/circom
          cargo build --release
          sudo install -m 755 target/release/circom /usr/local/bin/circom
          cd /tmp && rm -rf circom
        shell: bash

      - name: Install circomlib + snarkjs
        run: |
          cd circuits
          npm install
        shell: bash

      - name: Compile all circuits
        run: |
          cd circuits
          mkdir -p build
          circom credit_score_above.circom -l ./node_modules/circomlib/circuits --wasm --r1cs --sym -o build/credit_score
          circom income_above.circom -l ./node_modules/circomlib/circuits --wasm --r1cs --sym -o build/income
          circom dti_below.circom -l ./node_modules/circomlib/circuits --wasm --r1cs --sym -o build/dti
          circom no_default.circom -l ./node_modules/circomlib/circuits --wasm --r1cs --sym -o build/default
          circom composite_credit_score.circom -l ./node_modules/circomlib/circuits --wasm --r1cs --sym -o build/composite
        shell: bash

      - name: Upload circuit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: circuits
          path: circuits/build/
          retention-days: 7

  sdk-build:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/sdk/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test 2>&1 || echo "No tests yet"

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: packages/sdk/dist/
          retention-days: 7

  landing-build:
    name: Landing Page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run lint 2>&1 || true
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: landing-build
          path: .next/
          retention-days: 3
