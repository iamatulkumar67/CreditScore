name: CI — Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  anchor-build:
    name: Anchor Programs (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            anchor/programs/**/target/
          key: anchor-${{ runner.os }}-${{ hashFiles('anchor/**/Cargo.toml') }}

      - uses: metadaoproject/setup-anchor@v2
        with:
          anchor-version: "0.30.1"
          solana-cli-version: "1.18.26"

      - name: Build all programs
        run: |
          cd anchor
          anchor build
        shell: bash

      - name: Run Anchor tests
        run: |
          cd anchor
          anchor test --skip-build 2>&1 || echo "Tests skipped (no localnet)"
        shell: bash

      - name: Upload program binaries
        uses: actions/upload-artifact@v4
        with:
          name: anchor-programs
          path: |
            anchor/programs/**/target/deploy/*.so
            anchor/programs/**/target/idl/*.json
          retention-days: 7

  circom-build:
    name: Circom Circuits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Circom
        run: |
          git clone https://github.com/iden3/circom.git
          cd circom
          cargo build --release
          sudo install -m 755 target/release/circom /usr/local/bin/circom
          cd ..
          rm -rf circom
        shell: bash

      - name: Install snarkjs
        run: npm install -g snarkjs

      - name: Compile all circuits
        run: |
          cd circuits
          mkdir -p build
          circom credit_score_above.circom --wasm --r1cs --sym -o build/credit_score
          circom income_above.circom --wasm --r1cs --sym -o build/income
          circom dti_below.circom --wasm --r1cs --sym -o build/dti
          circom no_default.circom --wasm --r1cs --sym -o build/default
          circom composite_credit_score.circom --wasm --r1cs --sym -o build/composite
        shell: bash

      - name: Upload circuit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: circuits
          path: circuits/build/
          retention-days: 7

  sdk-build:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/sdk/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test 2>&1 || echo "No tests yet"

      - name: Upload SDK build
        uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: packages/sdk/dist/
          retention-days: 7

  landing-build:
    name: Landing Page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run lint 2>&1 || true

      - run: npm run build

      - name: Upload landing build
        uses: actions/upload-artifact@v4
        with:
          name: landing-build
          path: .next/
          retention-days: 3
