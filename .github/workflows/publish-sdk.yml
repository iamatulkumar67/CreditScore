name: Publish zkcreditscore-sdk to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    name: Build, version, publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: packages/sdk/package-lock.json

      - run: npm ci

      - run: npm version ${{ inputs.bump }} --no-git-tag-version

      - run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "zkcreditscore-bot"
          git config user.email "bot@zkscore.credit"
          git add package.json package-lock.json 2>/dev/null || git add package.json
          git commit -m "chore: bump SDK to v${VERSION}"
          git push
        shell: bash
