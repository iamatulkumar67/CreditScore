name: Deploy to Solana Devnet

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: "Target cluster"
        required: true
        default: "devnet"
        type: choice
        options:
          - devnet
          - mainnet-beta

jobs:
  deploy:
    name: Build & Deploy All Programs
    runs-on: ubuntu-latest
    environment: deployment
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2025-01-05
          components: rust-src

      - name: Install Solana CLI v1.18.26
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install Anchor CLI v0.30.1
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.30.1 anchor-cli --locked
        shell: bash

      - name: Setup deploy wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_DEPLOY_KEYPAIR }}' > ~/.config/solana/id.json
          solana config set --keypair ~/.config/solana/id.json
          solana config set --url ${{ inputs.cluster }}
          echo "Wallet: $(solana address)"
          echo "Balance: $(solana balance)"
        shell: bash

      - name: Build programs
        run: cd anchor && anchor build
        shell: bash

      - name: Deploy zk-credit-verifier
        run: |
          cd anchor
          solana program deploy \
            --program-id target/deploy/zk_credit_verifier-keypair.json \
            target/deploy/zk_credit_verifier.so
        shell: bash

      - name: Deploy zk-lending-pool
        run: |
          cd anchor
          solana program deploy \
            --program-id target/deploy/zk_lending_pool-keypair.json \
            target/deploy/zk_lending_pool.so
        shell: bash

      - name: Deploy zkc-token
        run: |
          cd anchor
          solana program deploy \
            --program-id target/deploy/zkc_token-keypair.json \
            target/deploy/zkc_token.so
        shell: bash

      - name: Deploy zk-governance
        run: |
          cd anchor
          solana program deploy \
            --program-id target/deploy/zk_governance-keypair.json \
            target/deploy/zk_governance.so
        shell: bash

      - name: Output deployment summary
        run: |
          echo "## ✅ Devnet Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Program | Address |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for json in anchor/target/deploy/*-keypair.json; do
            name=$(basename "$json" -keypair.json)
            addr=$(solana-keygen pubkey "$json")
            echo "| $name | $addr |" >> $GITHUB_STEP_SUMMARY
          done
        shell: bash
