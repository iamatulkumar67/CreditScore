name: Deploy to Solana Devnet

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Solana cluster"
        required: true
        default: "devnet"
        type: choice
        options:
          - devnet
          - mainnet-beta

jobs:
  deploy:
    name: Deploy Anchor Programs
    runs-on: ubuntu-latest
    environment: devnet
    steps:
      - uses: actions/checkout@v4

      - uses: metadaoproject/setup-anchor@v2
        with:
          anchor-version: "0.30.1"
          solana-cli-version: "1.18.26"

      - name: Generate deploy keypair
        run: |
          mkdir -p ~/.config/solana
          echo "${{ secrets.SOLANA_DEPLOY_KEYPAIR }}" > ~/.config/solana/id.json
          solana config set --keypair ~/.config/solana/id.json
          solana config set --url ${{ inputs.network }}
        shell: bash

      - name: Build programs
        run: |
          cd anchor
          anchor build
        shell: bash

      - name: Deploy zk-credit-verifier
        run: |
          cd anchor
          solana program deploy \
            programs/zk-credit-verifier/target/deploy/zk_credit_verifier.so \
            --program-id ZKVrf1111111111111111111111111111111111
        shell: bash

      - name: Deploy zk-lending-pool
        run: |
          cd anchor
          solana program deploy \
            programs/zk-lending-pool/target/deploy/zk_lending_pool.so \
            --program-id ZKPool111111111111111111111111111111111
        shell: bash

      - name: Deploy zkc-token
        run: |
          cd anchor
          solana program deploy \
            programs/zkc-token/target/deploy/zkc_token.so \
            --program-id ZKCToken1111111111111111111111111111111
        shell: bash

      - name: Initialize protocol config
        run: |
          cd anchor
          npx ts-node migrations/deploy.ts
        shell: bash

      - name: Output deployed addresses
        run: |
          echo "## Devnet Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Program | Address |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| zk-credit-verifier | ZKVrf1111111111111111111111111111111111 |" >> $GITHUB_STEP_SUMMARY
          echo "| zk-lending-pool | ZKPool111111111111111111111111111111111 |" >> $GITHUB_STEP_SUMMARY
          echo "| zkc-token | ZKCToken1111111111111111111111111111111111 |" >> $GITHUB_STEP_SUMMARY
          echo "| Network | ${{ inputs.network }} |" >> $GITHUB_STEP_SUMMARY
        shell: bash
