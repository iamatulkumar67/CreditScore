[package]
name = "zkc-token"
version = "0.1.0"
description = "ZKC Token — governance and utility token for ZKCreditScore Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token-2022"] }
spl-token-2022 = { version = "4.0.0", features = ["no-entrypoint"] }
spl-associated-token-account = "2.3.0"
solana-program = "1.18.17"
